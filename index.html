<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShopVerse</title>

  <!-- CSS FILE CONNECT -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- NAVBAR -->
  <header>

    <nav class="navbar">

      <h1>ShopVerse</h1>

      <ul>

        <li><a href="#">Home</a></li>

        <li><a href="#">Products</a></li>

        <li><a href="#">Contact</a></li>

      </ul>

    </nav>

  </header>

  <!-- HERO SECTION -->
  <section class="hero">

    <h2>Modern E-Commerce Store</h2>

    <p>Buy premium products online</p>

    <button>Shop Now</button>

  </section>

  <!-- PRODUCTS -->
  <section class="products">

    <h2>Featured Products</h2>

    <div class="product-container">

      <!-- PRODUCT 1 -->
      <div class="card">

        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Shoes">

        <h3>Nike Shoes</h3>

        <p>₹4,999</p>

        <button>Add to Cart</button>

      </div>

      <!-- PRODUCT 2 -->
      <div class="card">

        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="Watch">

        <h3>Smart Watch</h3>

        <p>₹7,999</p>

        <button>Add to Cart</button>

      </div>

      <!-- PRODUCT 3 -->
      <div class="card">

        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="Phone">

        <h3>iPhone</h3>

        <p>₹89,999</p>

        <button>Add to Cart</button>

      </div>

    </div>

  </section>

  <!-- FOOTER -->
  <footer>

    <p>© 2026 ShopVerse</p>

  </footer>

  <!-- JAVASCRIPT FILE CONNECT -->
  <script src="app.js"></script>

</body>

</html>
